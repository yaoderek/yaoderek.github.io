<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
// "derek yao" writes itself in a single-line script, then blooms into the
// Big Sur wallpaper. Deterministic: window.renderAt(t) draws the frame at t
// seconds, so a headless browser can step it frame by frame for video.
const W = +(new URLSearchParams(location.search).get('w') || 1280);
const H = +(new URLSearchParams(location.search).get('h') || 720);
const DURATION = 7.5;

const T = {
  writeStart: 0.45, writeEnd: 3.85,
  bloomStart: 4.05, bloomEnd: 6.1,
};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeInOutSine = (t) => -(Math.cos(Math.PI * clamp(t)) - 1) / 2;

// ---------- signature path + pen timing ----------
let SIG = null;     // { aspect, strokes }
let COST = null;    // per-stroke cumulative "time cost" arrays
let TOTAL = 0;

function buildTiming() {
  COST = [];
  let acc = 0;
  SIG.strokes.forEach((s, si) => {
    if (si > 0) {
      // pen lift: a short pause scaled by how far the pen travels
      const a = SIG.strokes[si - 1].at(-1), b = s[0];
      acc += 0.012 + Math.hypot(b[0] - a[0], b[1] - a[1]) * 0.25;
    }
    const c = [acc];
    for (let i = 1; i < s.length; i++) {
      const d = Math.hypot(s[i][0] - s[i - 1][0], s[i][1] - s[i - 1][1]);
      let k = 0;
      if (i > 1 && i < s.length) {
        const ax = s[i - 1][0] - s[i - 2][0], ay = s[i - 1][1] - s[i - 2][1];
        const bx = s[i][0] - s[i - 1][0], by = s[i][1] - s[i - 1][1];
        const cos = (ax * bx + ay * by) / ((Math.hypot(ax, ay) * Math.hypot(bx, by)) || 1);
        k = 1 - clamp(cos, -1, 1); // 0 straight .. 2 reversal
      }
      // a hand slows down through tight turns
      acc += d * (1 + 2.2 * k) + k * 0.004;
      c.push(acc);
    }
    COST.push(c);
  });
  TOTAL = acc;
}

// ---------- 2D signature canvas (2x for clean mips) ----------
const SS = 2;
const sigCanvas = document.createElement('canvas');
sigCanvas.width = W * SS; sigCanvas.height = H * SS;
const sctx = sigCanvas.getContext('2d');

function sigTransform(t) {
  // gentle push-in while writing, settling after the bloom
  const push = lerp(1.0, 1.035, easeInOutSine((t - T.writeStart) / (T.bloomEnd - T.writeStart)));
  const sw = W * SS * 0.6 * push;
  const sh = sw * SIG.aspect;
  const ox = (W * SS - sw) / 2;
  const oy = (H * SS - sh) / 2 - H * SS * 0.03;
  return { sw, ox, oy };
}

function drawSignature(t) {
  const { sw, ox, oy } = sigTransform(t);
  const p = clamp((t - T.writeStart) / (T.writeEnd - T.writeStart));
  // mostly-constant pen speed with soft start/finish
  const eased = p < 0.06 ? (p / 0.06) ** 2 * 0.03
    : p > 0.92 ? 1 - ((1 - p) / 0.08) ** 2 * 0.05
    : 0.03 + (p - 0.06) / 0.86 * 0.92;
  const target = eased * TOTAL;

  sctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
  sctx.lineCap = 'round';
  sctx.lineJoin = 'round';
  sctx.strokeStyle = '#fff';
  sctx.lineWidth = sw * 0.0085;

  let tip = null;
  SIG.strokes.forEach((s, si) => {
    const c = COST[si];
    if (target <= c[0]) return;
    sctx.beginPath();
    sctx.moveTo(ox + s[0][0] * sw, oy + s[0][1] * sw);
    for (let i = 1; i < s.length; i++) {
      if (c[i] <= target) {
        sctx.lineTo(ox + s[i][0] * sw, oy + s[i][1] * sw);
        tip = [ox + s[i][0] * sw, oy + s[i][1] * sw];
      } else {
        const f = (target - c[i - 1]) / (c[i] - c[i - 1]);
        const x = ox + lerp(s[i - 1][0], s[i][0], f) * sw;
        const y = oy + lerp(s[i - 1][1], s[i][1], f) * sw;
        sctx.lineTo(x, y);
        tip = [x, y];
        break;
      }
    }
    sctx.stroke();
  });
  const writing = p > 0 && p < 1;
  return { tip: tip ? [tip[0] / sigCanvas.width, tip[1] / sigCanvas.height] : [0.5, 0.5], tipOn: writing ? 1 : 0 };
}

// ---------- WebGL ----------
const canvas = document.getElementById('gl');
canvas.width = W; canvas.height = H;
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });

const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = vec2(aPos.x*0.5+0.5, 0.5-aPos.y*0.5); gl_Position = vec4(aPos,0.,1.); }`;

const FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uWall, uSig;
uniform vec2 uRes, uTip;
uniform float uTime, uReveal, uZoom, uWallBlur, uGlow, uRim, uFlash, uWhite, uShadow, uTipOn, uCropY;

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }

// smooth blur of the signature: golden-spiral taps at a given mip level
float sigBlur(vec2 uv, float lod, float radius){
  float s = 0.;
  for (int i = 0; i < 16; i++) {
    float fi = float(i) + .5;
    float r = sqrt(fi/16.) * radius;
    float a = fi * 2.39996;
    s += textureLod(uSig, uv + vec2(cos(a), sin(a)) * r * vec2(uRes.y/uRes.x, 1.), lod).r;
  }
  return s / 16.;
}

void main(){
  vec2 uv = vUv;
  float aspect = uRes.x / uRes.y;

  // cover-crop the square wallpaper into 16:9, zoom about the crop centre
  vec2 c = vec2(.5, uCropY);
  vec2 wuv = vec2(uv.x, uCropY + (uv.y - .5) / aspect);
  wuv = (wuv - c) / uZoom + c;
  vec3 wall = textureLod(uWall, wuv, uWallBlur).rgb;

  float core = texture(uSig, uv).r;
  float g1 = sigBlur(uv, 2., .006);
  float g2 = sigBlur(uv, 4., .025);
  float g3 = sigBlur(uv, 6., .09);
  float glow = g1*.55 + g2*.9 + g3*1.1;

  // bloom front: grows outward from the letters, edge broken up by noise
  vec2 p = (uv - .5) * vec2(aspect, 1.);
  float d = length(p * vec2(.8, 1.));
  float n = fbm(p * 2.2 + vec2(0., uTime * .12));
  float field = uReveal * 2.2 - .6 - d + (n - .5) * .28 + g3 * 1.3;
  float mask = smoothstep(0., .2, field);
  float rim = exp(-pow((field - .1) / .08, 2.));

  // the leading edge is the wallpaper itself, overexposed, so light seems to pour in
  float expo = 1. + uFlash * .35 + rim * uRim * 2.4;
  vec3 col = mix(vec3(0.), wall * expo + (uFlash * .05 + rim * uRim * .12) * vec3(1., .94, .86), mask);

  // soft shadow so the white script reads over the landscape
  float sh = sigBlur(uv - vec2(0., .005), 3., .01);
  col *= 1. - (.5 * sh + .35 * g3) * uShadow * mask;

  col += glow * uGlow * mix(vec3(.75, .85, 1.), vec3(1., .9, .75), uRim);
  col = mix(col, vec3(1.), core * uWhite);

  // a faint light where the pen touches
  vec2 tp = (uv - uTip) * vec2(aspect, 1.);
  col += uTipOn * exp(-dot(tp, tp) * 9000.) * vec3(.9, .95, 1.) * .55;

  // vignette + a hair of grain to keep gradients from banding
  float vig = smoothstep(1.25, .35, length((uv - .5) * vec2(aspect*.75, 1.)));
  col *= mix(.78, 1., vig);
  col += (hash(uv * uRes + uTime) - .5) * .012;
  o = vec4(col, 1.);
}`;

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ['uWall','uSig','uRes','uTip','uTime','uReveal','uZoom','uWallBlur','uGlow','uRim','uFlash','uWhite','uShadow','uTipOn','uCropY'])
  U[n] = gl.getUniformLocation(prog, n);

function makeTex(unit) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
const wallTex = makeTex(0);
const sigTex = makeTex(1);

function upload(unit, tex, src) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.generateMipmap(gl.TEXTURE_2D);
}

window.renderAt = (t) => {
  const { tip, tipOn } = drawSignature(t);
  upload(1, sigTex, sigCanvas);

  const b = (t - T.bloomStart) / (T.bloomEnd - T.bloomStart);
  const writeDone = sstep(T.writeEnd - 0.2, T.bloomStart + 0.1, t);
  const reveal = easeInOutSine(clamp(b));
  const flash = sstep(0, 0.25, b) * (1 - sstep(0.35, 1.0, b));

  gl.viewport(0, 0, W, H);
  gl.uniform1i(U.uWall, 0);
  gl.uniform1i(U.uSig, 1);
  gl.uniform2f(U.uRes, W, H);
  gl.uniform2f(U.uTip, tip[0], tip[1]);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uReveal, reveal);
  // wallpaper arrives soft and close, then sharpens and pulls back (Ken Burns tail)
  gl.uniform1f(U.uZoom, lerp(1.32, 1.0, easeOutCubic((t - T.bloomStart) / (DURATION - T.bloomStart))));
  gl.uniform1f(U.uWallBlur, lerp(5.0, 0.0, easeOutCubic(b * 1.15)));
  // glow: faint while writing, swells as the bloom ignites, then fades out
  gl.uniform1f(U.uGlow, 0.07 + writeDone * 0.3 * (1 - sstep(0.2, 0.9, b)) - sstep(0.5, 1.0, b) * 0.07);
  gl.uniform1f(U.uRim, sstep(0, 0.15, b) * (1 - sstep(0.75, 1.0, b)));
  gl.uniform1f(U.uFlash, flash);
  gl.uniform1f(U.uWhite, 1.0);
  gl.uniform1f(U.uShadow, sstep(0.3, 0.9, b));
  gl.uniform1f(U.uTipOn, tipOn);
  gl.uniform1f(U.uCropY, 0.43);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
};

window.DURATION = DURATION;
window.ready = (async () => {
  SIG = await (await fetch('sig.json')).json();
  buildTiming();
  const img = new Image();
  img.src = 'wall.jpg';
  await img.decode();
  upload(0, wallTex, img);
  window.renderAt(0);
})();
</script>
</body>
</html>
