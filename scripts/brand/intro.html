<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
// "derek yao" signs itself like a real hand (variable speed and pressure),
// then the Big Sur wallpaper fades in blurred and sharpens, like macOS
// logging in. Deterministic: window.renderAt(t) draws the frame at t seconds,
// so a headless browser can step it frame by frame for video.
const W = +(new URLSearchParams(location.search).get('w') || 1280);
const H = +(new URLSearchParams(location.search).get('h') || 720);
const DURATION = 7.5;

const T = {
  writeStart: 0.35, writeEnd: 3.95,
  revealStart: 4.2, revealEnd: 6.1,
};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeInOutSine = (t) => -(Math.cos(Math.PI * clamp(t)) - 1) / 2;

// ---------- signature path + pen timing ----------
// The strokes come with the time each point was drawn (signature.mjs runs a
// simulated hand), so the reveal replays that motion as-is, scaled to fit.
// Ink pools where the pen slows and pulls down, and thins where it flies.
let SIG = null;     // { aspect, strokes: [[x, y, t]] }
let PEN = null;     // per stroke: { t: [s], w: [width] }, times in seconds from writeStart

const WRITE = T.writeEnd - T.writeStart;
const LIFT = 0.16;  // seconds the pen hangs in the air between words

function smooth(a, r) {
  const out = a.slice();
  for (let i = 0; i < a.length; i++) {
    let s = 0, n = 0;
    for (let j = Math.max(0, i - r); j <= Math.min(a.length - 1, i + r); j++) { s += a[j]; n++; }
    out[i] = s / n;
  }
  return out;
}

function buildTiming() {
  const raw = SIG.strokes.map((s) => {
    const n = s.length;
    const ds = [0];
    for (let i = 1; i < n; i++) ds.push(Math.hypot(s[i][0] - s[i - 1][0], s[i][1] - s[i - 1][1]));
    const speed = s.map((p, i) => (i ? ds[i] / Math.max(1e-5, p[2] - s[i - 1][2]) : 0));
    speed[0] = speed[1];
    const v = smooth(smooth(speed, 8), 8);
    const down = smooth(s.map((p, i) => {
      const q = s[Math.min(n - 1, i + 1)], r = s[Math.max(0, i - 1)];
      return (q[1] - r[1]) / (Math.hypot(q[0] - r[0], q[1] - r[1]) || 1);
    }), 9);
    return { t: s.map((p) => p[2]), v, down, ds, len: ds.reduce((x, y) => x + y, 0) };
  });

  const ink = raw.reduce((a, r) => a + r.t.at(-1), 0);
  const scale = (WRITE - LIFT * (raw.length - 1)) / ink;
  const vs = raw.flatMap((r) => r.v).sort((a, b) => a - b);
  const vlo = vs[Math.floor(vs.length * 0.05)], vhi = vs[Math.floor(vs.length * 0.95)];
  let start = 0;
  PEN = raw.map((r, si) => {
    let along = 0;
    const w = r.v.map((vi, i) => {
      along += r.ds[i];
      const slow = 1 - clamp((vi - vlo) / (vhi - vlo));      // 1 = slowest
      // thin, fast upstrokes; heavier where the pen slows or pulls down
      const press = 0.42 + 0.55 * Math.pow(slow, 1.2) + 0.65 * Math.max(0, r.down[i]);
      // pen lands softly and lifts off fast; the final swash trails off long
      const tailLen = si === raw.length - 1 ? 0.22 : 0.05;
      const head = sstep(0, 0.012, along / r.len);
      const tail = sstep(0, tailLen, 1 - along / r.len);
      return press * (0.25 + 0.75 * head) * (0.08 + 0.92 * tail);
    });
    const t = r.t.map((x) => start + x * scale);
    start = t.at(-1) + LIFT;
    return { t, w };
  });
}

// ---------- 2D signature canvas (2x for clean mips) ----------
const SS = 2;
const sigCanvas = document.createElement('canvas');
sigCanvas.width = W * SS; sigCanvas.height = H * SS;
const sctx = sigCanvas.getContext('2d');

function sigTransform(t) {
  // gentle push-in while writing, settling as the desktop sharpens
  const push = lerp(1.0, 1.03, easeInOutSine((t - T.writeStart) / (T.revealEnd - T.writeStart)));
  const sw = W * SS * 0.64 * push;
  const sh = sw * SIG.aspect;
  const ox = (W * SS - sw) / 2;
  const oy = (H * SS - sh) / 2 - H * SS * 0.005;
  return { sw, ox, oy };
}

function drawSignature(t) {
  const { sw, ox, oy } = sigTransform(t);
  const now = t - T.writeStart;
  const base = sw * 0.0072;

  sctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
  sctx.lineCap = 'round';
  sctx.strokeStyle = '#fff';

  let tip = null;
  SIG.strokes.forEach((s, si) => {
    const { t: ts, w } = PEN[si];
    if (now <= ts[0]) return;
    let px = ox + s[0][0] * sw, py = oy + s[0][1] * sw;
    for (let i = 1; i < s.length; i++) {
      let f = 1;
      if (ts[i] > now) f = (now - ts[i - 1]) / (ts[i] - ts[i - 1]);
      const x = ox + lerp(s[i - 1][0], s[i][0], f) * sw;
      const y = oy + lerp(s[i - 1][1], s[i][1], f) * sw;
      sctx.lineWidth = base * lerp(w[i - 1], w[i], f * 0.5);
      sctx.beginPath(); sctx.moveTo(px, py); sctx.lineTo(x, y); sctx.stroke();
      px = x; py = y; tip = [x, y];
      if (f < 1) break;
    }
  });
  const writing = now > 0 && now < WRITE;
  return { tip: tip ? [tip[0] / sigCanvas.width, tip[1] / sigCanvas.height] : [0.5, 0.5], tipOn: writing ? 1 : 0 };
}

// ---------- WebGL ----------
const canvas = document.getElementById('gl');
canvas.width = W; canvas.height = H;
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });

const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = vec2(aPos.x*0.5+0.5, 0.5-aPos.y*0.5); gl_Position = vec4(aPos,0.,1.); }`;

const FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uWall, uSig;
uniform vec2 uRes, uTip;
uniform float uTime, uFade, uBlur, uZoom, uGlow, uExpo, uShadow, uTipOn, uCropY;

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }

// smooth blur of the signature: golden-spiral taps at a given mip level
float sigBlur(vec2 uv, float lod, float radius){
  float s = 0.;
  for (int i = 0; i < 16; i++) {
    float fi = float(i) + .5;
    float r = sqrt(fi/16.) * radius;
    float a = fi * 2.39996;
    s += textureLod(uSig, uv + vec2(cos(a), sin(a)) * r * vec2(uRes.y/uRes.x, 1.), lod).r;
  }
  return s / 16.;
}

// a smooth wide blur of the wallpaper (radius in uv): spiral taps at a mip
// level matched to the radius, so even a heavy blur has no blocky texels
vec3 wallBlur(vec2 uv, float r){
  if (r < 0.0004) return textureLod(uWall, uv, 0.).rgb;
  float lod = max(0., log2(r * float(textureSize(uWall, 0).x) / 6.));
  vec3 s = vec3(0.);
  for (int i = 0; i < 32; i++) {
    float fi = float(i) + .5;
    float a = fi * 2.39996;
    s += textureLod(uWall, uv + vec2(cos(a), sin(a)) * sqrt(fi / 32.) * r, lod).rgb;
  }
  return s / 32.;
}

void main(){
  vec2 uv = vUv;
  float aspect = uRes.x / uRes.y;

  // cover-crop the square wallpaper into 16:9, zoom about the crop centre
  vec2 c = vec2(.5, uCropY);
  vec2 wuv = vec2(uv.x, uCropY + (uv.y - .5) / aspect);
  wuv = (wuv - c) / uZoom + c;
  vec3 wall = wallBlur(wuv, uBlur);

  float core = texture(uSig, uv).r;
  float g1 = sigBlur(uv, 2., .006);
  float g2 = sigBlur(uv, 4., .025);
  float g3 = sigBlur(uv, 6., .09);
  float glow = g1*.55 + g2*.9 + g3*1.1;

  // like macOS logging in: the wallpaper appears blurred and dimmed, as it is
  // behind the login window, then the blur clears to the sharp desktop
  vec3 col = wall * uExpo * uFade;

  // soft shadow so the white script reads over the landscape
  float sh = sigBlur(uv - vec2(0., .005), 3., .01);
  col *= 1. - (.55 * sh + .25 * g2 + .45 * g3) * uShadow * uFade;

  col += glow * uGlow * vec3(1., .96, .9);
  col = mix(col, vec3(1.), core);

  // a faint light where the pen touches
  vec2 tp = (uv - uTip) * vec2(aspect, 1.);
  col += uTipOn * exp(-dot(tp, tp) * 9000.) * vec3(.9, .95, 1.) * .55;

  // a hair of static dither to keep the blur from banding
  col += (hash(uv * uRes) - .5) * .008;
  o = vec4(col, 1.);
}`;

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ['uWall','uSig','uRes','uTip','uTime','uFade','uBlur','uZoom','uGlow','uExpo','uShadow','uTipOn','uCropY'])
  U[n] = gl.getUniformLocation(prog, n);

function makeTex(unit) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
const wallTex = makeTex(0);
const sigTex = makeTex(1);

function upload(unit, tex, src) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.generateMipmap(gl.TEXTURE_2D);
}

window.renderAt = (t) => {
  const { tip, tipOn } = drawSignature(t);
  upload(1, sigTex, sigCanvas);

  const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  // fade the blurred, dimmed wallpaper in, then clear the blur
  const fade = easeOutCubic((t - T.revealStart) / 0.7);
  const clear = easeInOutCubic(clamp((t - T.revealStart - 0.3) / (T.revealEnd - T.revealStart - 0.3)));

  gl.viewport(0, 0, W, H);
  gl.uniform1i(U.uWall, 0);
  gl.uniform1i(U.uSig, 1);
  gl.uniform2f(U.uRes, W, H);
  gl.uniform2f(U.uTip, tip[0], tip[1]);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uFade, fade);
  gl.uniform1f(U.uBlur, lerp(0.045, 0.0, clear));
  gl.uniform1f(U.uExpo, lerp(0.62, 0.92, clear));
  // a slight settle into place as it sharpens
  gl.uniform1f(U.uZoom, lerp(1.06, 1.0, easeOutCubic((t - T.revealStart) / (DURATION - T.revealStart))));
  gl.uniform1f(U.uGlow, 0.06 * (1 - clear));
  gl.uniform1f(U.uShadow, clear);
  gl.uniform1f(U.uTipOn, tipOn);
  gl.uniform1f(U.uCropY, 0.43);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
};

window.DURATION = DURATION;
window.ready = (async () => {
  SIG = await (await fetch('sig.json')).json();
  buildTiming();
  const img = new Image();
  img.src = 'wall.jpg';
  await img.decode();
  upload(0, wallTex, img);
  window.renderAt(0);
})();
</script>
</body>
</html>
